[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindmaply"
version = "0.1.0"
description = "Branching, block-based conversations with LLMs, visualised as a mind map"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.108.0",  # Starlette >= 0.29: request-first TemplateResponse
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1.0",
    "google-genai>=1.0.0",
    "numpy>=1.24",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
mindmap-chat = "mindmap_chat.main:main"

[tool.setuptools.packages.find]
include = ["mindmap_chat*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before config is imported
"mindmap_chat/main.py" = ["E402"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "my-fastapi-app"]
