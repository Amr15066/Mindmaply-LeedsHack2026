[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindmaply"
version = "0.1.0"
description = "Branching, block-based conversations with LLMs, visualised as a mind map"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1.0",
    "google-generativeai>=0.3.0",
    "google-genai>=0.3.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
mindmap-chat = "mindmap_chat.main:main"

[tool.setuptools.packages.find]
include = ["mindmap_chat*"]
